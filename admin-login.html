<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Auto Responder</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <div class="admin-login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header reveal">
                    <a href="/" class="logo-large" title="Auto Responder — Home">Auto Responder</a>
                    <h2>Admin Dashboard</h2>
                    <p>Enter your credentials to access the dashboard</p>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="form-group reveal">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required placeholder="admin">
                    </div>

                    <div class="form-group reveal reveal-delay-1">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>

                    <div id="loginError" class="login-error" style="display: none;">
                        Invalid username or password
                    </div>

                    <button type="submit" class="btn btn-primary btn-large btn-shine reveal reveal-delay-2">
                        Login
                    </button>
                </form>

                <div class="login-footer">
                    <a href="/">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script src="admin-login.js"></script>
    <script src="animations.js"></script>
</body>
</html>
